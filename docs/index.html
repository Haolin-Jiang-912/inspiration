<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>社会认知测评 · Social Cognition</title>
<meta name="description" content="35道题，测出你的社会认知画像，并匹配一位历史人物与一首属于你的歌。">
<style>
  :root {
    --bg: #0A0A0C;
    --card: #1C1C1E;
    --card-2: #2C2C2E;
    --text: #FFFFFF;
    --text-dim: #8E8E93;
    --blue: #0A84FF;
    --green: #30D158;
    --cyan: #64D2FF;
    --red: #FF453A;
    --purple: #BF5AF2;
    --orange: #FF9F0A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    min-height: 100vh; max-width: 560px; margin: 0 auto; padding: 24px 20px 48px;
    letter-spacing: .01em;
  }
  .screen { display: none; animation: fadein .4s ease; }
  .screen.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- Home ---------- */
  .hero {
    background: var(--card); border-radius: 28px; padding: 40px 28px 32px;
    text-align: center; margin-top: 8vh;
  }
  .hero h1 { font-size: 34px; font-weight: 700; letter-spacing: .02em; }
  .hero .sub { color: var(--text-dim); font-size: 15px; margin-top: 10px; }
  .hero .quote {
    margin: 28px auto 0; font-size: 17px; line-height: 1.8; color: var(--text);
    opacity: .92; font-weight: 300;
  }
  .hero .quote strong { font-weight: 600; }
  .dim-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 26px; }
  .dim-chip {
    background: rgba(255,255,255,.06); border-radius: 999px; padding: 7px 14px;
    font-size: 13px; color: #C7C7CC;
  }
  .dim-chip b { color: var(--blue); font-weight: 600; }
  .meta-row { display: flex; gap: 10px; margin-top: 24px; justify-content: center; }
  .meta-chip {
    background: rgba(255,255,255,.06); border-radius: 14px; padding: 10px 16px;
    font-size: 13px; color: #C7C7CC; text-align: center;
  }
  .meta-chip .num { display: block; font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
  .btn-primary {
    display: block; width: 100%; background: #FFFFFF; color: #000;
    border: none; border-radius: 18px; padding: 17px; font-size: 17px; font-weight: 600;
    margin-top: 28px; cursor: pointer; transition: transform .15s ease, opacity .15s ease;
    font-family: inherit;
  }
  .btn-primary:active { transform: scale(.97); opacity: .85; }
  .btn-ghost {
    display: block; width: 100%; background: rgba(255,255,255,.08); color: #fff;
    border: none; border-radius: 18px; padding: 16px; font-size: 16px; font-weight: 500;
    margin-top: 14px; cursor: pointer; transition: transform .15s ease;
    font-family: inherit;
  }
  .btn-ghost:active { transform: scale(.97); }
  .footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 40px; letter-spacing: .08em; }

  /* ---------- Quiz ---------- */
  .quiz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .quiz-count { color: var(--text-dim); font-size: 14px; }
  .quiz-count b { color: var(--text); font-size: 16px; }
  .progress { height: 4px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--blue); border-radius: 2px; transition: width .3s ease; }
  .q-card {
    background: var(--card); border-radius: 24px; padding: 28px 22px; margin-top: 20px;
  }
  .q-dim { color: var(--text-dim); font-size: 13px; margin-bottom: 10px; }
  .q-text { font-size: 20px; font-weight: 600; line-height: 1.55; }
  .options { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
  .option {
    background: var(--card); border: 1.5px solid rgba(255,255,255,.06); border-radius: 18px;
    padding: 16px 16px 16px 14px; display: flex; align-items: flex-start; gap: 12px;
    cursor: pointer; transition: all .18s ease; font-size: 15.5px; line-height: 1.5;
  }
  .option:active { transform: scale(.98); }
  .option.sel { background: rgba(10,132,255,.12); border-color: rgba(10,132,255,.5); }
  .opt-badge {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,255,255,.08); color: #C7C7CC; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .option.sel .opt-badge { background: var(--blue); color: #fff; }

  /* ---------- Result ---------- */
  .res-hero {
    border-radius: 28px; padding: 36px 26px; text-align: center; color: #fff;
    background: linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,0)) , var(--card);
    border: 1px solid rgba(255,255,255,.07); margin-top: 4px;
  }
  .res-tag { font-size: 13px; letter-spacing: .12em; opacity: .75; }
  .res-name { font-size: 30px; font-weight: 700; margin-top: 10px; line-height: 1.3; }
  .res-score { margin-top: 18px; }
  .res-score .big { font-size: 52px; font-weight: 700; }
  .res-score .small { color: var(--text-dim); font-size: 15px; }
  .res-core {
    background: var(--card); border-radius: 22px; padding: 24px 22px; margin-top: 16px;
    font-size: 15.5px; line-height: 1.85; color: rgba(255,255,255,.88); font-weight: 300;
  }
  .sec-title { color: var(--text-dim); font-size: 13px; letter-spacing: .14em; margin: 30px 4px 14px; }
  .card { background: var(--card); border-radius: 22px; padding: 22px; }
  .behave-list { list-style: none; }
  .behave-list li {
    position: relative; padding-left: 20px; font-size: 14.5px; line-height: 1.7;
    color: rgba(255,255,255,.85); margin-bottom: 10px; font-weight: 300;
  }
  .behave-list li::before {
    content: ""; position: absolute; left: 2px; top: 10px; width: 6px; height: 6px;
    border-radius: 50%; background: var(--pc, var(--blue));
  }
  .blind { background: var(--card); border-radius: 22px; padding: 22px; font-size: 14.5px; line-height: 1.8; color: rgba(255,255,255,.75); font-weight: 300; }
  .blind b { color: #FFD60A; font-weight: 600; }

  .radar-wrap { display: flex; justify-content: center; padding: 6px 0; }
  .dim-rows { display: flex; flex-direction: column; gap: 16px; margin-top: 6px; }
  .dim-row .dim-head { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
  .dim-row .dim-head span:last-child { color: var(--text-dim); }
  .dim-bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
  .dim-fill { height: 100%; border-radius: 4px; background: var(--pc, var(--blue)); transition: width 1s ease; }
  .dim-desc { font-size: 12.5px; color: var(--text-dim); margin-top: 8px; line-height: 1.65; font-weight: 300; }

  .figure-card { display: flex; gap: 18px; align-items: flex-start; }
  .fig-avatar {
    flex-shrink: 0; width: 68px; height: 68px; border-radius: 50%;
    background: var(--pc, var(--blue)); color: #fff; font-size: 26px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 4px rgba(255,255,255,.06);
  }
  .fig-info h3 { font-size: 19px; font-weight: 700; }
  .fig-info .fig-title { color: var(--text-dim); font-size: 13px; margin-top: 3px; }
  .fig-info .fig-bio { font-size: 13.5px; color: rgba(255,255,255,.8); margin-top: 10px; line-height: 1.7; font-weight: 300; }
  .fig-match { font-size: 13.5px; line-height: 1.75; color: rgba(255,255,255,.7); margin-top: 14px; font-weight: 300; }
  .fig-match b { color: rgba(255,255,255,.92); font-weight: 600; }

  .song-card { background: var(--card); border-radius: 22px; padding: 30px 24px; text-align: center; }
  .song-cover {
    width: 130px; height: 130px; border-radius: 50%; margin: 0 auto;
    background: linear-gradient(140deg, var(--pc, #333), #1a1a1c);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.5), 0 0 0 5px rgba(255,255,255,.05);
  }
  .song-cover .disc {
    width: 26px; height: 26px; border-radius: 50%; background: var(--bg);
    box-shadow: 0 0 0 3px rgba(255,255,255,.15);
  }
  .song-name { font-size: 22px; font-weight: 700; margin-top: 20px; letter-spacing: .02em; }
  .song-artist { color: var(--text-dim); font-size: 14px; margin-top: 6px; }
  .song-lyric {
    font-size: 15px; font-style: italic; color: rgba(255,255,255,.75);
    margin-top: 18px; line-height: 1.9; font-weight: 300;
  }
  .song-label { color: var(--text-dim); font-size: 12px; letter-spacing: .16em; margin-bottom: 20px; }

  .res-actions { margin-top: 34px; }

  /* ---------- Share modal ---------- */
  .modal-mask {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75);
    z-index: 100; align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(6px);
  }
  .modal-mask.show { display: flex; }
  .modal-box { text-align: center; max-width: 100%; }
  .modal-box img {
    width: min(340px, 78vw); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .modal-btns { display: flex; gap: 10px; margin-top: 18px; justify-content: center; }
  .modal-btns .btn-primary, .modal-btns .btn-ghost { width: auto; padding: 12px 26px; margin-top: 0; font-size: 15px; }
</style>
</head>
<body>

<!-- ============ 首页 ============ -->
<div class="screen active" id="scr-home">
  <div class="hero">
    <h1>社会认知测评</h1>
    <div class="sub">Designed by Haolin Harry Jiang</div>
    <div class="quote">「 <strong>你的语言，<br>就是你世界的边界。</strong> 」</div>
    <div class="dim-chips" id="home-chips"></div>
    <div class="meta-row">
      <div class="meta-chip"><span class="num">35</span>道情境题</div>
      <div class="meta-chip"><span class="num">6</span>个认知维度</div>
      <div class="meta-chip"><span class="num">7</span>种人物画像</div>
    </div>
    <button class="btn-primary" onclick="startQuiz()">开始测评</button>
  </div>
  <div class="footer">Designed by Harry Jiang</div>
</div>

<!-- ============ 答题页 ============ -->
<div class="screen" id="scr-quiz">
  <div class="quiz-top">
    <div class="quiz-count"><b id="q-now">1</b> / 35</div>
  </div>
  <div class="progress"><div class="progress-bar" id="q-bar" style="width:2.8%"></div></div>
  <div class="q-card">
    <div class="q-dim" id="q-dim"></div>
    <div class="q-text" id="q-text"></div>
  </div>
  <div class="options" id="q-options"></div>
</div>

<!-- ============ 结果页 ============ -->
<div class="screen" id="scr-result">
  <div class="res-hero" id="res-hero">
    <div class="res-tag" id="res-tag"></div>
    <div class="res-name" id="res-name"></div>
    <div class="res-score"><span class="big" id="res-score"></span><span class="small" id="res-total"></span></div>
  </div>

  <div class="sec-title">画 像 解 析</div>
  <div class="res-core" id="res-core"></div>

  <div class="sec-title">典 型 表 现</div>
  <div class="card"><ul class="behave-list" id="res-behaviors"></ul></div>

  <div class="sec-title">六 维 度 雷 达</div>
  <div class="card"><div class="radar-wrap"><canvas id="radar" width="600" height="480" style="width:300px;height:240px"></canvas></div></div>

  <div class="sec-title">维 度 得 分</div>
  <div class="card"><div class="dim-rows" id="res-dims"></div></div>

  <div class="sec-title">历 史 镜 像</div>
  <div class="card figure-card" id="res-figure"></div>

  <div class="sec-title">为 你 选 的 一 首 歌</div>
  <div class="song-card">
    <div class="song-label">— THE SONG FOR YOU —</div>
    <div class="song-cover" id="song-cover"><div class="disc"></div></div>
    <div class="song-name" id="song-name"></div>
    <div class="song-artist" id="song-artist"></div>
    <div class="song-lyric" id="song-lyric"></div>
  </div>

  <div class="res-actions">
    <button class="btn-primary" onclick="makeShareCard()">生成分享卡片</button>
    <button class="btn-ghost" onclick="location.reload()">重新测评</button>
  </div>
  <div class="footer">Designed by Harry Jiang</div>
</div>

<!-- ============ 分享卡片弹窗 ============ -->
<div class="modal-mask" id="share-modal">
  <div class="modal-box">
    <img id="share-img" alt="分享卡片">
    <div class="modal-btns">
      <a class="btn-primary" id="share-dl" download="社会认知测评.png">保存图片</a>
      <button class="btn-ghost" onclick="closeShare()">关闭</button>
    </div>
  </div>
</div>

const HIGH_RATE = 0.75, LOW_RATE = 0.5;
const dimName = {}; dimensions.forEach(d => dimName[d.id] = d.shortName);

/* ==================== 评分逻辑（与小程序一致） ==================== */
function computeResult(answers) {
  const perQuestion = {}; let totalScore = 0, totalMax = 0;
  questions.forEach(q => {
    const maxScore = Math.max(...q.options.map(o => o.score));
    totalMax += maxScore;
    const idx = answers[q.id];
    if (idx == null || !q.options[idx]) { perQuestion[q.id] = 0; return; }
    const s = q.options[idx].score;
    perQuestion[q.id] = s; totalScore += s;
  });
  const dims = dimensions.map(dim => {
    let score = 0, max = 0;
    dim.questions.forEach(qid => {
      const q = questions.find(x => x.id === qid); if (!q) return;
      max += Math.max(...q.options.map(o => o.score));
      score += perQuestion[qid] || 0;
    });
    const rate = max > 0 ? score / max : 0;
    let level = 'mid';
    if (rate >= HIGH_RATE) level = 'high'; else if (rate < LOW_RATE) level = 'low';
    return {
      id: dim.id, name: dim.name, shortName: dim.shortName, icon: dim.icon,
      score: Math.round(score * 10) / 10, max, rate, level,
      levelText: level === 'high' ? '高' : level === 'mid' ? '中' : '低',
      levelDesc: level === 'high' ? dim.highDesc : level === 'mid' ? dim.midDesc : dim.lowDesc,
      percent: Math.round(rate * 100)
    };
  });
  const totalRate = totalMax > 0 ? totalScore / totalMax : 0;
  const profile = judgeProfile(dims, totalRate);
  return { dims, totalScore, totalMax, totalRate, totalPercent: Math.round(totalRate * 100), profile };
}

function judgeProfile(dims, totalRate) {
  const rate = dims.map(d => d.rate);
  const [d1, d2, d3, d4, d5, d6] = rate;
  const avg = totalRate;
  const keyDims = [d1, d3, d4, d6];
  const countHigh = keyDims.filter(r => r >= HIGH_RATE).length;
  const countLow = keyDims.filter(r => r < 0.55).length;
  const othersAvg = (d1 + d2 + d3 + d5 + d6) / 5;
  const maxRate = Math.max(...rate);

  if (avg >= HIGH_RATE && countHigh >= 3) return profiles[0];
  if (maxRate < 0.7 && (avg < 0.5 || (countLow >= 3 && avg < 0.62))) return profiles[4];
  if (rate.every(r => r >= 0.4 && r <= 0.8)) return profiles[6];
  if (d4 >= 0.8 && othersAvg >= 0.4 && othersAvg < 0.7) return profiles[5];
  if (d5 >= 0.7 && d3 >= 0.55 && d4 < 0.65 && d6 < 0.65) return profiles[2];
  if (d1 >= 0.7 && d2 >= 0.6 && d3 >= 0.6 && d4 < 0.75 && d6 < 0.75) return profiles[3];
  if (d2 >= 0.7 && d3 >= 0.55 && d4 < 0.65 && d6 < 0.65 && d1 < 0.75) return profiles[1];
  if (avg >= 0.7) {
    const highDims = [1,2,3,4,5,6].filter(i => rate[i-1] >= 0.7);
    if (highDims.includes(5) && highDims.includes(3)) return profiles[2];
    if (highDims.includes(2) && highDims.includes(3)) return profiles[1];
    if (highDims.includes(1)) return profiles[3];
    return profiles[0];
  }
  if (avg < 0.6) return profiles[4];
  return profiles[6];
}

/* ==================== 答题 ==================== */
let cur = 0;
const answers = {};

function startQuiz() {
  cur = 0;
  document.getElementById('scr-home').classList.remove('active');
  document.getElementById('scr-quiz').classList.add('active');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[cur];
  document.getElementById('q-now').textContent = cur + 1;
  document.getElementById('q-bar').style.width = ((cur + 1) / questions.length * 100) + '%';
  document.getElementById('q-dim').textContent = dimName[q.dimension] + ' · 第 ' + (cur + 1) + ' 题';
  document.getElementById('q-text').textContent = q.text;
  const box = document.getElementById('q-options');
  box.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = '<div class="opt-badge">' + letters[i] + '</div><div>' + opt.text + '</div>';
    div.onclick = () => selectOption(i);
    box.appendChild(div);
  });
  window.scrollTo(0, 0);
}

function selectOption(i) {
  const opts = document.querySelectorAll('.option');
  opts.forEach(o => o.classList.remove('sel'));
  opts[i].classList.add('sel');
  answers[questions[cur].id] = i;
  setTimeout(() => {
    if (cur < questions.length - 1) { cur++; renderQuestion(); }
    else showResult();
  }, 260);
}

  document.getElementById('res-core').textContent = p.core;

/* ==================== 雷达图 ==================== */
function drawRadar(dims, color, ctx2, W, H, scale) {
  const cv = document.getElementById('radar');
  const ctx = ctx2 || cv.getContext('2d');
  const w = W || 600, h = H || 480;
  if (!scale) { ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,w,h); }
  const cx = w / 2, cy = h / 2 + 6, R = Math.min(w, h) * 0.34;
  const n = dims.length;
  const angle = i => -Math.PI / 2 + i * 2 * Math.PI / n;

  // 网格
  for (let ring = 1; ring <= 4; ring++) {
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const a = angle(i % n), r = R * ring / 4;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  // 轴线与标签
  ctx.font = '24px -apple-system, PingFang SC, sans-serif';
  ctx.fillStyle = '#8E8E93';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  dims.forEach((d, i) => {
    const a = angle(i);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.stroke();
    const lx = cx + (R + 42) * Math.cos(a), ly = cy + (R + 34) * Math.sin(a);
    ctx.fillText(d.shortName, lx, ly);
  });
  // 数据面
  ctx.beginPath();
  dims.forEach((d, i) => {
    const a = angle(i), r = R * Math.max(d.rate, 0.04);
    const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = hexA(color, 0.22);
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  dims.forEach((d, i) => {
    const a = angle(i), r = R * Math.max(d.rate, 0.04);
    ctx.beginPath();
    ctx.arc(cx + r * Math.cos(a), cy + r * Math.sin(a), 4.5, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
  });
}
function hexA(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

/* ==================== 分享卡片 ==================== */
function makeShareCard() {
  const p = RESULT.profile;
  const W = 600, H = 1240;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  // 背景
  ctx.fillStyle = '#0A0A0C'; ctx.fillRect(0, 0, W, H);
  // 顶部渐变光晕
  const grad = ctx.createLinearGradient(0, 0, 0, 300);
  grad.addColorStop(0, hexA(p.color, 0.18));
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, 300);
  // 顶部装饰线
  ctx.fillStyle = p.color; ctx.fillRect(0, 0, W, 6);

  ctx.textAlign = 'center';
  // 标题
  ctx.fillStyle = '#8E8E93';
  ctx.font = '300 22px -apple-system, PingFang SC, sans-serif';
  ctx.fillText('社 会 认 知 测 评', W / 2, 70);
  // 画像
  ctx.fillStyle = p.color;
  ctx.font = '600 20px -apple-system, PingFang SC, sans-serif';
  ctx.fillText(p.tag, W / 2, 120);
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '700 46px -apple-system, PingFang SC, sans-serif';
  ctx.fillText(p.name, W / 2, 172);
  // 分数
  ctx.fillStyle = p.color;
  ctx.font = '700 96px -apple-system, PingFang SC, sans-serif';
  ctx.fillText(String(RESULT.totalPercent), W / 2, 290);
  ctx.fillStyle = '#8E8E93';
  ctx.font = '300 20px -apple-system, PingFang SC, sans-serif';
  ctx.fillText('综合认知指数 / 100', W / 2, 326);

  // 雷达图
  drawRadar(RESULT.dims, p.color, ctx, W, 520, true);

  // 维度分
  ctx.textAlign = 'left';
  let y = 610;
  RESULT.dims.forEach(d => {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = '400 20px -apple-system, PingFang SC, sans-serif';
    ctx.fillText(d.icon + ' ' + d.shortName, 60, y);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    roundBar(ctx, 250, y - 12, 230, 12, 6);
    ctx.fillStyle = p.color;
    roundBar(ctx, 250, y - 12, Math.max(230 * d.rate, 10), 12, 6);
    ctx.fillStyle = '#8E8E93';
    ctx.textAlign = 'right';
    ctx.fillText(d.score + '/' + d.max, 540, y);
    ctx.textAlign = 'left';
    y += 44;
  });

  // 人物
  y += 14;
  ctx.fillStyle = p.color;
  ctx.beginPath(); ctx.arc(88, y + 24, 30, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '700 30px -apple-system, PingFang SC, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(p.figure.name.charAt(0), 88, y + 34);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '600 26px -apple-system, PingFang SC, sans-serif';
  ctx.fillText('历史镜像：' + p.figure.name, 136, y + 18);
  ctx.fillStyle = '#8E8E93';
  ctx.font = '300 19px -apple-system, PingFang SC, sans-serif';
  ctx.fillText(p.figure.title, 136, y + 48);

  // 歌曲区
  y += 110;
  const cx2 = W / 2;
  ctx.beginPath(); ctx.arc(cx2, y + 56, 58, 0, Math.PI * 2);
  const g2 = ctx.createLinearGradient(cx2 - 58, y, cx2 + 58, y + 112);
  g2.addColorStop(0, p.color); g2.addColorStop(1, '#1a1a1c');
  ctx.fillStyle = g2; ctx.fill();
  ctx.beginPath(); ctx.arc(cx2, y + 56, 12, 0, Math.PI * 2);
  ctx.fillStyle = '#0A0A0C'; ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '700 30px -apple-system, PingFang SC, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('《' + p.song.name + '》', cx2, y + 156);
  ctx.fillStyle = '#8E8E93';
  ctx.font = '300 20px -apple-system, PingFang SC, sans-serif';
  ctx.fillText(p.song.artist, cx2, y + 186);
  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.font = 'italic 300 20px -apple-system, PingFang SC, sans-serif';
  ctx.fillText('“' + p.song.lyric + '”', cx2, y + 222);

  // 底部
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '300 17px -apple-system, PingFang SC, sans-serif';
  ctx.fillText('Designed by Harry Jiang', W / 2, H - 36);

  const url = cv.toDataURL('image/png');
  document.getElementById('share-img').src = url;
  document.getElementById('share-dl').href = url;
  document.getElementById('share-modal').classList.add('show');
}
function roundBar(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath(); ctx.fill();
}
function closeShare() {
  document.getElementById('share-modal').classList.remove('show');
}
